            const ps=[...scope.matchAll(/<(p|h2|h3|li)[\s>][\s\S]*?<\/\1>/gi)].map(m=>one(m[0])).filter(x=>x.length>40&&!/cookie|подпиш|подписат|реклам|©|все права|telegram-канал|наш канал/i.test(x));
