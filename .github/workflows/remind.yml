              const r=await post("sendMessage",{text:L.join("\n"),disable_web_page_preview:true});
              if(r.ok){
                const j=await r.json();
                if(TEST!=="true"){sent[dk]=now;changed=true}
                try{await post("unpinAllChatMessages",{});if(j.result&&j.result.message_id)await post("pinChatMessage",{message_id:j.result.message_id,disable_notification:true})}catch(e){}
              }
              console.log("Утренняя сводка:",r.ok?"отправлена":"не отправилась ("+r.status+")");
              try{await sendPaper()}catch(e){console.log("Газета: ошибка",e.message)}
            }
          }
          for(const k of Object.keys(sent))if(sent[k]<now-14*864e5){delete sent[k];changed=true}
