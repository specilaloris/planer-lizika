                out.push({cat,catName:CATN[cat],title:cap(one(e.title)),when,where:e.place?[one(e.place.title),one(e.place.address)].filter(Boolean).join(", "):"",
                  price:e.is_free?"бесплатно":one(e.price||""),desc:short(e.description),img:e.images&&e.images[0]&&e.images[0].image||"",link:e.site_url||(e.id?"https://kudago.com/spb/event/"+e.id+"/":"")});
