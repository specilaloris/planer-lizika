              const isTask=t=>t&&!t.deleted&&(!t.kind||t.kind==="task");
              const list=items.filter(t=>isTask(t)&&t.date&&occurs(t,today)&&!((t.repeat&&t.repeat.freq)?(t.doneDates||[]).includes(today):t.done))
                .sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));
              const dls=items.filter(t=>isTask(t)&&t.due&&!t.done&&!(t.repeat&&t.repeat.freq)&&t.due<=lim3)
                .sort((a,b)=>(a.due+(a.dueTime||"99")).localeCompare(b.due+(b.dueTime||"99")));
              const L=["☀️ План на "+hd(today)+", "+DOWN[nd.getDay()]];
              if(list.length)for(const t of list)L.push("• "+(t.time?t.time+" ":"")+t.title+" · "+(CAT[t.cat]||"Личное"));
              else L.push("Дел на сегодня нет.");
              if(dls.length){L.push("","🚩 Сроки:");for(const t of dls)L.push("• "+(t.due<today?"просрочено: ":t.due===today?"сегодня: ":hd(t.due)+": ")+t.title+(t.dueTime?" (до "+t.dueTime+")":""))}
