          const DIG=String(process.env.DIGEST_TIME||"08:00").trim();
          if(/^\d{1,2}:\d{2}$/.test(DIG)){
            const nd=new Date(),[dh,dm]=DIG.split(":").map(Number),mins=nd.getHours()*60+nd.getMinutes(),dk="digest@"+today;
            const inWindow=mins>=dh*60+dm&&mins<dh*60+dm+180;
            if(TEST==="true"||(!sent[dk]&&inWindow)){
              const DOWN=["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
              const hd=s=>Number(s.slice(8))+" "+MON[Number(s.slice(5,7))-1];
