                for(const m of html.matchAll(/<script[^>]+application\/ld\+json[^>]*>([\s\S]*?)<\/script>/gi)){
                  let data;try{data=JSON.parse(m[1])}catch(e){continue}
                  const list=[].concat(data).flatMap(x=>x&&x["@graph"]?x["@graph"]:[x]).flatMap(x=>x&&x.itemListElement?x.itemListElement.map(i=>i.item||i):[x]);
                  for(const e of list){
