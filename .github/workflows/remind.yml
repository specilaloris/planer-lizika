                "&fields=id,title,short_title,dates,place,site_url,images,description,price,is_free,categories";
              let txt=await getUrl(u,15000),src="KudaGo";
              if(!/^\s*\{/.test(txt)){const r=await viaReader(u,"text");const a=r.indexOf("{"),b=r.lastIndexOf("}");txt=a>=0?r.slice(a,b+1):"";src="KudaGo через читалку"}
              let j=null;try{j=JSON.parse(txt||"null")}catch(e){}
