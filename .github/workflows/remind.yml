# Напоминания «Планера Лизика» в Telegram — о делах и о сроках сдачи, даже когда планер закрыт.
# Нужны 3 секрета в Settings → Secrets and variables → Actions:
#   PLANER_TOKEN        — тот же токен, что вводится в планере (доступ к planer-data)
#   TELEGRAM_BOT_TOKEN  — токен бота от @BotFather
#   TELEGRAM_CHAT_ID    — ваш id в Telegram (узнать у @userinfobot)
# Если хранилище называется не planer-lizika-data, создайте переменную DATA_REPO = логин/название.
# Утренняя сводка (план на день и сроки) приходит в 8:00 и закрепляется в чате. Другое время: переменная DIGEST_TIME = 07:30, выключить: off.
# Сразу за сводкой приходит утренняя газета (HTML-файл): статьи, погода в Петербурге, цитата дня. Выключить: переменная NEWS = off.
# Журнал запусков в публичном репозитории виден всем, поэтому названия дел в него не пишутся.

name: Напоминания в Telegram

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Отправить тестовое сообщение"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: remind-lizik
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TZ: Europe/Moscow
      DATA_REPO: ${{ vars.DATA_REPO || format('{0}/planer-lizika-data', github.repository_owner) }}
      DATA_TOKEN: ${{ secrets.PLANER_TOKEN }}
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
      TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
      DIGEST_TIME: ${{ vars.DIGEST_TIME || '08:00' }}
      NEWS: ${{ vars.NEWS || '' }}
    steps:
      - name: Отправить напоминания
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          const {DATA_REPO,DATA_TOKEN,TG_TOKEN,TG_CHAT,TEST}=process.env;
          if(!DATA_TOKEN||!TG_TOKEN||!TG_CHAT){console.log("Не заданы секреты PLANER_TOKEN, TELEGRAM_BOT_TOKEN или TELEGRAM_CHAT_ID");process.exit(1)}
          const H={Authorization:"Bearer "+DATA_TOKEN,Accept:"application/vnd.github+json","User-Agent":"planer-lizika-remind"};
          const api=p=>`https://api.github.com/repos/${DATA_REPO}/contents/${p}`;
          async function get(p){
            const r=await fetch(api(p),{headers:H});
            if(r.status===404)return {data:null,sha:null};
            if(!r.ok){console.log(`Хранилище ответило ${r.status}: проверьте PLANER_TOKEN и название репозитория`);process.exit(1)}
            const j=await r.json();let txt=Buffer.from(j.content||"","base64").toString("utf8");
            if(!txt&&j.size>0){const r2=await fetch(api(p),{headers:{...H,Accept:"application/vnd.github.raw+json"}});txt=await r2.text()}
            return {data:txt?JSON.parse(txt):null,sha:j.sha};
          }
          async function tg(text){
            const r=await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:TG_CHAT,text,disable_web_page_preview:true})});
            if(!r.ok)console.log("Telegram ответил",r.status,"— проверьте токен бота, id и что вы нажали Start у бота");
            return r.ok;
          }
          const CAT={anc:"Найдём предков",edit:"Редактура",study:"Учёба",personal:"Личное",health:"Здоровье"};
          const MON=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
          const pad=n=>String(n).padStart(2,"0");
          const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());

          if(TEST==="true"){await tg("Планер Лизика: напоминания в Telegram подключены. Сюда будут приходить дела и сроки сдачи.");}

          const {data}=await get("data.json");
          const items=Array.isArray(data)?data:((data&&data.items)||[]);
          const state=await get("notified.json");const sent=state.data||{};
          const now=Date.now(),today=iso(new Date());
          const due=[];
          const fromIso=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
          const dim=(y,m)=>new Date(y,m+1,0).getDate();
          function occurs(t,d){
            const rp=t.repeat;if(!rp||!rp.freq)return t.date===d;
            if(d<t.date||(rp.until&&d>rp.until)||(t.skipDates||[]).includes(d))return false;
            const s=fromIso(t.date),x=fromIso(d),dw=x.getDay();
            if(rp.freq==="daily")return true;
            if(rp.freq==="weekdays")return dw>=1&&dw<=5;
            if(rp.freq==="weekly"||rp.freq==="biweekly"){
              const days=rp.days&&rp.days.length?rp.days:[s.getDay()];if(!days.includes(dw))return false;
              if(rp.freq==="weekly")return true;
              const mon=z=>{const q=new Date(z);q.setDate(q.getDate()-((q.getDay()+6)%7));return q};
              return Math.round((mon(x)-mon(s))/6048e5)%2===0;
            }
            if(rp.freq==="monthly")return x.getDate()===Math.min(s.getDate(),dim(x.getFullYear(),x.getMonth()));
            if(rp.freq==="yearly")return x.getMonth()===s.getMonth()&&x.getDate()===Math.min(s.getDate(),dim(x.getFullYear(),x.getMonth()));
            return false;
          }
          const dates=[-1,0,1].map(o=>{const q=new Date();q.setDate(q.getDate()+o);return iso(q)});
          for(const t of items){
            if(!t||t.deleted||(t.kind&&t.kind!=="task")||!t.date)continue;
            const rem=typeof t.remind==="number"?t.remind:(t.time?15:-1);if(rem<0)continue;
            const series=!!(t.repeat&&t.repeat.freq);
            for(const day of dates){
              if(!occurs(t,day))continue;
              if(series?(t.doneDates||[]).includes(day):t.done)continue;
              const [y,m,d]=day.split("-").map(Number),[h,mi]=(t.time||"09:00").split(":").map(Number);
              const at=new Date(y,m-1,d,h,mi).getTime()-rem*60000,key=t.id+"@"+at;
              if(at<=now&&at>now-6*3600e3&&!sent[key])due.push({t:{...t,date:day},at,key});
            }
          }
          // сроки сдачи: due (YYYY-MM-DD), dueTime, dueRem (минуты до срока; -1 = нет; по умолчанию 1440)
          for(const t of items){
            if(!t||t.deleted||(t.kind&&t.kind!=="task")||!t.due||t.done||(t.repeat&&t.repeat.freq))continue;
            const r=typeof t.dueRem==="number"?t.dueRem:1440;if(r<0)continue;
            const [y,m,d]=t.due.split("-").map(Number),[h,mi]=(t.dueTime||"09:00").split(":").map(Number);
            const at=new Date(y,m-1,d,h,mi).getTime()-r*60000,key=t.id+"@due@"+at;
            if(at<=now&&(at>now-6*3600e3||now<at+r*60000)&&!sent[key])due.push({t,at,key,dl:true});
          }
          due.sort((a,b)=>a.at-b.at);
          let changed=false,ok=0;
          const tomorrow=dates[2];
          const human=d=>Number(d.slice(8))+" "+MON[Number(d.slice(5,7))-1];
          for(const {t,key,dl} of due){
            if(dl){
              const w=(t.due===today?"сегодня":t.due===tomorrow?"завтра":human(t.due))+(t.dueTime?" в "+t.dueTime:"");
              const text=["🚩 Срок сдачи: "+t.title,"Срок "+w+" · "+(CAT[t.cat]||"Личное"),t.note||""].filter(Boolean).join("\n");
              if(await tg(text)){sent[key]=now;changed=true;ok++}
              continue;
            }
            const when=t.date===today?(t.time?"Сегодня в "+t.time:"Сегодня"):(Number(t.date.slice(8))+" "+MON[Number(t.date.slice(5,7))-1]+(t.time?" в "+t.time:""));
            const text=["⏰ "+t.title,when+" · "+(CAT[t.cat]||"Личное"),t.note||""].filter(Boolean).join("\n");
            if(await tg(text)){sent[key]=now;changed=true;ok++}
          }
          // утренняя газета: статьи из RSS (полный текст из ленты или со страницы), погода в Петербурге, цитата дня
          // переменная NEWS = off выключает газету; названия статей в журнал не пишутся
          const NEWS=[
            {title:"Хорошие новости",n:4,days:3,feeds:[
              {name:"Позитивные новости",url:"https://positivnews.ru/feed/"},
              {name:"Good News Network",fb:true,url:"https://www.goodnewsnetwork.org/feed/"},
              {name:"Positive News",fb:true,url:"https://www.positive.news/feed/"},
              {name:"Reasons to be Cheerful",fb:true,url:"https://reasonstobecheerful.world/feed/"}]},
            {title:"Мода",n:5,days:2,feeds:[
              {name:"Grazia",google:true,url:"https://news.google.com/rss/search?q="+encodeURIComponent("site:graziamagazine.ru when:3d")+"&hl=ru&gl=RU&ceid=RU:ru"},
              {name:"Лента.ру · Ценности",url:"https://lenta.ru/rss/articles/style"},
              {name:"ELLE",google:true,url:"https://news.google.com/rss/search?q="+encodeURIComponent("site:elle.ru when:2d")+"&hl=ru&gl=RU&ceid=RU:ru"},
              {name:"The Symbol",google:true,url:"https://news.google.com/rss/search?q="+encodeURIComponent("site:thesymbol.ru when:2d")+"&hl=ru&gl=RU&ceid=RU:ru"},
              {name:"Лента.ру · Ценности",fb:true,url:"https://lenta.ru/rss/news/style"},
              {name:"Google Новости",google:true,fb:true,url:"https://news.google.com/rss/search?q="+encodeURIComponent("мода тренды when:1d")+"&hl=ru&gl=RU&ceid=RU:ru"}]}];
          const PAPER={title:"Утренняя газета Лизика",over:"Хорошие новости, мода и афиша",file:"gazeta-lizika",afisha:true,
            fonts:"Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=PT+Serif:wght@400;700",display:"'Cormorant Garamond',Georgia,serif",body:"'PT Serif',Georgia,serif",
            colors:{bg:"#F2E9DC",paper:"#FBF7F0",fg:"#30150E",muted:"#76604F",accent:"#5C1621",on:"#F8E9DC",line:"#DDCDB8",soft:"#F3E8DA"}};
          const QUOTES=[
            {q:"Я пришёл к тебе с приветом, рассказать, что солнце встало",a:"А. А. Фет"},
            {q:"Счастливые часов не наблюдают",a:"А. С. Грибоедов, «Горе от ума»"},
            {q:"Хочешь быть счастливым — будь им",a:"Козьма Прутков"},
            {q:"Смотри в корень!",a:"Козьма Прутков"},
            {q:"Никто не обнимет необъятного",a:"Козьма Прутков"},
            {q:"Краткость — сестра таланта",a:"А. П. Чехов"},
            {q:"В человеке должно быть всё прекрасно: и лицо, и одежда, и душа, и мысли",a:"А. П. Чехов, «Дядя Ваня»"},
            {q:"Красота спасёт мир",a:"Ф. М. Достоевский, «Идиот»"},
            {q:"Если жизнь тебя обманет, не печалься, не сердись!",a:"А. С. Пушкин"},
            {q:"Всё мгновенно, всё пройдёт; что пройдёт, то будет мило",a:"А. С. Пушкин"},
            {q:"Унылая пора! Очей очарованье!",a:"А. С. Пушкин, «Осень»",m:[9,10,11]},
            {q:"Мороз и солнце; день чудесный!",a:"А. С. Пушкин, «Зимнее утро»",m:[12,1,2]},
            {q:"Блажен, кто смолоду был молод",a:"А. С. Пушкин, «Евгений Онегин»"},
            {q:"Какой же русский не любит быстрой езды?",a:"Н. В. Гоголь, «Мёртвые души»"},
            {q:"Нам не дано предугадать, как слово наше отзовётся",a:"Ф. И. Тютчев"},
            {q:"Люблю грозу в начале мая",a:"Ф. И. Тютчев",m:[5]},
            {q:"Утро вечера мудренее",a:"русская пословица"},
            {q:"Глаза боятся, а руки делают",a:"русская пословица"},
            {q:"Тише едешь — дальше будешь",a:"русская пословица"},
            {q:"Дорогу осилит идущий",a:"пословица"},
            {q:"Где хотенье, там и уменье",a:"русская пословица"},
            {q:"Не имей сто рублей, а имей сто друзей",a:"русская пословица"},
            {q:"Век живи — век учись",a:"русская пословица"},
            {q:"Делу время, потехе час",a:"русская пословица"},
            {q:"Всякому овощу своё время",a:"русская пословица"},
            {q:"Москва не сразу строилась",a:"русская пословица"},
            {q:"Под лежачий камень вода не течёт",a:"русская пословица"}];
          const WMO={0:["ясно","☀️"],1:["преимущественно ясно","🌤"],2:["переменная облачность","⛅"],3:["пасмурно","☁️"],45:["туман","🌫"],48:["изморозь и туман","🌫"],
            51:["слабая морось","🌦"],53:["морось","🌦"],55:["сильная морось","🌧"],56:["ледяная морось","🌧"],57:["ледяная морось","🌧"],
            61:["небольшой дождь","🌦"],63:["дождь","🌧"],65:["сильный дождь","🌧"],66:["ледяной дождь","🌧"],67:["ледяной дождь","🌧"],
            71:["небольшой снег","🌨"],73:["снег","🌨"],75:["сильный снег","❄️"],77:["снежная крупа","🌨"],
            80:["кратковременный дождь","🌦"],81:["ливень","🌧"],82:["сильный ливень","⛈"],85:["снегопад","🌨"],86:["сильный снегопад","❄️"],
            95:["гроза","⛈"],96:["гроза с градом","⛈"],99:["гроза с градом","⛈"]};
          const ENT={quot:'"',apos:"'",lt:"<",gt:">",nbsp:" ",laquo:"«",raquo:"»",mdash:"—",ndash:"–",hellip:"…",rsquo:"’",lsquo:"‘",ldquo:"“",rdquo:"”",bdquo:"„",amp:"&"};
          const dec=s=>String(s||"").replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g,"$1").replace(/<(br|\/p|\/div|\/li|\/h\d)[^>]*>/gi,"\n").replace(/<[^>]+>/g," ")
            .replace(/&#(\d+);/g,(m,n)=>String.fromCodePoint(+n)).replace(/&#x([0-9a-f]+);/gi,(m,n)=>String.fromCodePoint(parseInt(n,16)))
            .replace(/&([a-z]+);/gi,(m,n)=>ENT[n.toLowerCase()]??m).replace(/[ \t\r\f\v]+/g," ").replace(/ *\n */g,"\n").trim();
          const one=s=>dec(s).replace(/\s+/g," ");
          const tag=(x,n)=>{const m=x.match(new RegExp("<"+n+"(?:\\s[^>]*)?>([\\s\\S]*?)</"+n+">","i"));return m?m[1]:""};
          const escH=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
          const UA={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36","Accept-Language":"ru,en;q=0.8"};
          async function getUrl(url,ms=12000){
            const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),ms);
            try{const r=await fetch(url,{signal:ac.signal,headers:UA,redirect:"follow"});if(!r.ok)return "";return await r.text()}catch(e){return ""}finally{clearTimeout(tm)}
          }
          // чистка текста: скрипты и рекламный код, служебные хвосты («Использованные источники», «The post … appeared first», «Уважаемый читатель»), голые ссылки
          const STOP=/^(использованные источники|источники:|уважаемый читатель|the post .{0,200} appeared first|больше (хороших|забавных|позитивных|интересных)?\s*новост|читайте также|смотрите также|по теме:|подписывайтесь|подпишитесь|отправить новость|поделиться|теги:|related:|also read)/i;
          const JUNK=/yaContextCb|Ya\.Context|renderTo|blockId|adsbygoogle|googletag|window\.|document\.|=>|^\s*[{}()\];,]+\s*$|^\}\)|^function\b|^var |^const |^let /;
          const DROPL=/^(источник|фото( обложки)?|фото|иллюстрация|реклама|erid|advertisement)\s*[:.]|^(https?:\/\/|www\.)\S+$|^\S+\.(ru|com|org|net)(\/\S*)?$|^(читать далее|читать дальше|подробнее|read more)\b/i;
          function clean(ps){
            const out=[];
            for(let x of ps){
              x=x.replace(/^время на прочтение:?\s*\d+\s*минут\S*\s*/i,"").replace(/\s+([,.;:!?)])/g,"$1").trim();
              if(!x)continue;if(STOP.test(x))break;
              if(JUNK.test(x)||DROPL.test(x)||x.length<3)continue;
              if(/^[A-Z][A-Z\s’'-]{5,}[:…]/.test(x)||/^(?:[A-Z]{2,}[\s’'-]+){2,}/.test(x)||/^[A-Z]{4,}\s*:/.test(x))continue; // английские промо-строки капслоком
              out.push(x);
            }
            return out;
          }
          const toParas=t=>clean(dec(String(t||"").replace(/<(script|style|noscript)[\s\S]*?<\/\1>/gi,"")).split(/\n+/).map(x=>x.replace(/\s+/g," ").trim()));
          const goodImg=u=>u&&/^https?:/.test(u)&&!/s\.w\.org\/images\/core\/emoji|\/emoji\/|gravatar|pixel|counter|1x1/i.test(u);
          const firstImg=h=>{for(const m of String(h||"").matchAll(/<img[^>]+src=["']([^"']+)["']/gi))if(goodImg(m[1]))return m[1];return ""};
          async function feed(f){
            const xml=await getUrl(f.url);if(!xml)return [];
            const blocks=xml.match(/<item[\s>][\s\S]*?<\/item>/gi)||xml.match(/<entry[\s>][\s\S]*?<\/entry>/gi)||[];
            return blocks.map(b=>{
              let title=one(tag(b,"title")),link=one(tag(b,"link")),src=f.name;
              if(!/^https?:/.test(link)){const m=b.match(/<link[^>]*href="([^"]+)"/i);link=m?m[1].replace(/&amp;/g,"&"):""}
              if(f.google){const m=title.match(/^(.*\S)\s+[-–—]\s+([^-–—]{2,60})$/);if(m){title=m[1];src=m[2].trim()}}
              const raw=(tag(b,"content:encoded")||tag(b,"content")||tag(b,"description")||tag(b,"summary")).replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g,"$1").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&amp;/g,"&");
              const enc=(b.match(/<(?:enclosure|media:content|media:thumbnail)[^>]+url="([^"]+)"/i)||[])[1];
              const ds=one(tag(b,"pubDate")||tag(b,"published")||tag(b,"updated")||tag(b,"dc:date"));
              return {title:title.length>200?title.slice(0,197)+"…":title,link,src,google:!!f.google,paras:f.google?[]:toParas(raw),img:(goodImg(enc)?enc:firstImg(raw)||"").replace(/&amp;/g,"&"),t:ds?(Date.parse(ds)||0):0};
            }).filter(x=>x.title&&/^https?:/.test(x.link)).sort((a,b)=>b.t-a.t);
          }
          // текст со страницы статьи: абзацы внутри <article> (или всей страницы), картинка из og:image
          // запасной путь к сайтам, которые не пускают сервер GitHub: читалка r.jina.ai открывает страницу сама и отдаёт текст
          async function viaReader(url,fmt="markdown",ms=25000){
            const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),ms);
            try{const r=await fetch("https://r.jina.ai/"+url,{signal:ac.signal,headers:{"User-Agent":UA["User-Agent"],"X-Return-Format":fmt,"Accept":"text/plain"}});return r.ok?await r.text():""}catch(e){return ""}finally{clearTimeout(tm)}
          }
          const mdParas=md=>clean(String(md||"").replace(/^[\s\S]*?Markdown Content:\s*/,"").split(/\n\s*\n/).map(x=>x.replace(/!\[[^\]]*\]\([^)]*\)/g,"").replace(/\[([^\]]*)\]\([^)]*\)/g,"$1").replace(/^#+\s*|^[*-]\s+|[*_]{2,}/gm,"").replace(/\s+/g," ").trim()).filter(x=>x.length>40&&!/^(title|url source|published time):/i.test(x)));
          // автоперевод (Google Переводчик): для кратких русских версий английских статей
          async function tr(text){
            text=String(text||"").slice(0,1800);if(!text)return "";
            try{const j=JSON.parse(await getUrl("https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ru&dt=t&q="+encodeURIComponent(text),12000)||"null");return j&&j[0]?j[0].map(x=>x&&x[0]||"").join("").trim():""}catch(e){return ""}
          }
          const isEn=t=>!/[а-яё]/i.test(t)&&(t.match(/[a-z]/gi)||[]).length>t.length*.5;
          async function fromPage(it){
            if(it.google){const u=await gnResolve(it.link);if(!u)return;it.link=u;it.google=false}
            const raw=await getUrl(it.link,10000);
            if(!raw){const md=await viaReader(it.link);const ps=mdParas(md);if(ps.join(" ").length>it.paras.join(" ").length){it.paras=ps;it.via=1}
